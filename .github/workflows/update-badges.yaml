name: Update Test Badges

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  update-badges:
    name: Count tests and update badges
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Count tests and update gist
        env:
          GH_TOKEN: ${{ secrets.BADGE_SECRET }}
        run: |
          set +e

          UNIT_OUTPUT=$(cargo nextest run --all-features -E 'not test(connects_to_public) & not test(get_block_range_supports)' 2>&1)
          UNIT=$(echo "$UNIT_OUTPUT" | grep -oE '[0-9]+ tests? run' | grep -oE '^[0-9]+' | head -1)
          UNIT=${UNIT:-0}

          INT_OUTPUT=$(cargo nextest run --all-features -E 'test(connects_to_public) | test(get_block_range_supports)' 2>&1)
          INT=$(echo "$INT_OUTPUT" | grep -oE '[0-9]+ tests? run' | grep -oE '^[0-9]+' | head -1)
          INT=${INT:-0}

          DOC_OUTPUT=$(cargo test --doc --all-features 2>&1)
          DOC=$(echo "$DOC_OUTPUT" | grep -oE '[0-9]+ passed' | grep -oE '^[0-9]+' | head -1)
          DOC=${DOC:-0}

          set -e

          echo "Unit: $UNIT, Doc: $DOC, Integration: $INT"

          echo "{\"schemaVersion\":1,\"label\":\"unit tests\",\"message\":\"$UNIT\",\"color\":\"brightgreen\"}" > /tmp/unit.json
          echo "{\"schemaVersion\":1,\"label\":\"doc tests\",\"message\":\"$DOC\",\"color\":\"violet\"}" > /tmp/doc.json
          echo "{\"schemaVersion\":1,\"label\":\"integration tests\",\"message\":\"$INT\",\"color\":\"blue\"}" > /tmp/integration.json

          gh gist edit ${{ secrets.BADGE_GIST_ID }} \
            -f unit.json=/tmp/unit.json \
            -f doc.json=/tmp/doc.json \
            -f integration.json=/tmp/integration.json
