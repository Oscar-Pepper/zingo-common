name: CI - Nightly

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  reject-trailing-whitespace:
    name: Reject trailing whitespace
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject trailing whitespace
        run: ./utils/trailing-whitespace.sh reject

  cargo-shear:
    uses: zingolabs/infrastructure/.github/workflows/cargo-shear.yaml@867b6501f3e6145ddce9c84b64fdda961e31e24b

  cargo-checkmate:
    uses: zingolabs/infrastructure/.github/workflows/cargo-checkmate.yaml@867b6501f3e6145ddce9c84b64fdda961e31e24b

  cargo-hack-build:
    uses: zingolabs/infrastructure/.github/workflows/cargo-checkmate.yaml@867b6501f3e6145ddce9c84b64fdda961e31e24b
    with:
      hack-subcommand: build
