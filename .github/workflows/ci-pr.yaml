name: CI checks

on:
  workflow_dispatch:
  push:
    tags:
      - '**'
  pull_request:

jobs:
  reject-trailing-whitespace:
    name: Reject trailing whitespace
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject trailing whitespace
        run: ./utils/trailing-whitespace.sh reject

  cargo-shear:
    uses: zingolabs/infrastructure/.github/workflows/cargo-shear.yaml@dev

  cargo-checkmate:
    uses: ./.github/workflows/cargo-checkmate.yaml
