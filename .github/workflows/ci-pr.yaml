name: CI - PR

on:
  workflow_dispatch:
  push:
    tags:
      - '**'
  pull_request:

jobs:
  reject-trailing-whitespace:
    uses: zingolabs/infrastructure/.github/workflows/trailing-whitespace.yaml@867b6501f3e6145ddce9c84b64fdda961e31e24b

  cargo-shear:
    uses: zingolabs/infrastructure/.github/workflows/cargo-shear.yaml@867b6501f3e6145ddce9c84b64fdda961e31e24b

  cargo-checkmate:
    uses: zingolabs/infrastructure/.github/workflows/cargo-checkmate.yaml@867b6501f3e6145ddce9c84b64fdda961e31e24b

  cargo-hack-check:
    uses: zingolabs/infrastructure/.github/workflows/cargo-hack.yaml@867b6501f3e6145ddce9c84b64fdda961e31e24b
    with:
      hack-subcommand: check
