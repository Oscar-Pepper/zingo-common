[package]
name = "zingo-netutils"
version = "1.1.0"
description = "network utility crate"
authors = ["zingo@zingolabs.org"]
edition = "2024"
repository = "https://github.com/zingolabs/zingo-common"
homepage = "https://github.com/zingolabs/zingo-common"
license = "MIT"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
http-body.workspace = true
http.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
hyper.workspace = true
thiserror.workspace = true
tokio-rustls.workspace = true
tonic.workspace = true

zcash_client_backend = { workspace = true, features = [
    "lightwalletd-tonic",
    "transparent-inputs",
    "tor",
] }

[dev-dependencies]
rustls-pemfile.workspace = true
tokio.workspace = true
http-body-util.workspace = true
x509-parser = { workspace = true }
