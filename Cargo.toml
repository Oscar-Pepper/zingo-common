[workspace]
members = ["zingo_common_components", "zingo-netutils"]
resolver = "2"

[workspace.dependencies]

# network
http = "1.1.0"
http-body = "1"
hyper-util = "0.1.20"
hyper = { version = "1" }
hyper-rustls = { version = "0.27" }
http-body-util = "0.1.3"
rustls-pemfile = "2"
tokio-rustls = "0.26"
tokio = { version = "1" }
tonic = { version = "0.14.4", features = ["tls-webpki-roots"] }

# error
thiserror = "1.0.64"
x509-parser = "0.18"
zcash_client_backend = "0.21"
